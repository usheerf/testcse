name: Onboard Payment Refund API to Postman

on:
  workflow_dispatch: 
  push:
    branches:
      - main
    paths:
      - 'specs/payment-refund-api-openapi.yaml'

jobs:
  postman-onboarding:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Postman API Onboarding
        uses: postman-cs/postman-api-onboarding-action@main
        with:
          # Using project-name instead of workspace-name based on the valid inputs list
          project-name: 'Payment Services'
          
          # Make sure to replace usheerf/testcse with your actual repo path if it changes!
          spec-url: 'https://raw.githubusercontent.com/usheerf/testcse/main/specs/payment-refund-api-openapi.yaml'

          # This disables the creation of the secondary ci.yml workflow to bypass the GitHub token restriction
          generate-ci-workflow: 'false'
          
          # Moved secrets from 'env:' to 'with:' so the action can read them
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ secrets.POSTMAN_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
