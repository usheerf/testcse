$kind: http-example
request:
  url: "{{baseUrl}}/refunds"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: json
    content: |-
      {
        "transactionId": "txn_1234567890abcdef",
        "amount": null,
        "reason": "Customer requested refund",
        "notifyCustomer": true,
        "metadata": {
          "initiatedBy": "admin@example.com",
          "ticketNumber": "TKT-12345"
        }
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "TRANSACTION_TOO_OLD",
        "message": "Refunds cannot be issued more than 180 days after the original transaction",
        "details": {
          "transactionId": "txn_1234567890abcdef",
          "transactionDate": "2023-06-01T00:00:00Z",
          "daysSinceTransaction": 195,
          "maxDaysAllowed": 180
        },
        "code": "BUSINESS_RULE_VIOLATION",
        "timestamp": "2024-01-15T10:30:00Z"
      }
order: 6000
