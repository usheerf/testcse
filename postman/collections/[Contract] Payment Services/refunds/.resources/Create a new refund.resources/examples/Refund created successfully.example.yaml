$kind: http-example
request:
  url: "{{baseUrl}}/refunds"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: json
    content: |-
      {
        "transactionId": "txn_1234567890abcdef",
        "amount": null,
        "reason": "Customer requested refund",
        "notifyCustomer": true,
        "metadata": {
          "initiatedBy": "admin@example.com",
          "ticketNumber": "TKT-12345"
        }
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: Content-Type
      value: application/json
    - key: Location
      value: https://a.co
      disabled: false
      description: URI of the created refund resource
  body:
    type: json
    content: |-
      {
        "refundId": "rfnd_abc123def456",
        "transactionId": "txn_1234567890abcdef",
        "status": "pending",
        "amount": 5000,
        "currency": "USD",
        "refundAmount": 5000,
        "refundCurrency": "USD",
        "reason": "Customer requested refund",
        "createdAt": "2024-01-15T10:30:00Z",
        "updatedAt": "2024-01-15T10:30:00Z",
        "estimatedCompletionTime": "2024-01-15T14:30:00Z",
        "metadata": {
          "initiatedBy": "admin@example.com",
          "ticketNumber": "TKT-12345"
        },
        "links": {
          "self": "/refunds/rfnd_abc123def456",
          "status": "/refunds/rfnd_abc123def456/status",
          "cancel": "/refunds/rfnd_abc123def456/cancel"
        }
      }
order: 1000
