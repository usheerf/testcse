$kind: http-example
request:
  url: "{{baseUrl}}/refunds?transactionId=txn_1234567890abcdef&status=pending&startDate=2024-01-01T00:00:00Z&endDate=2024-01-31T23:59:59Z&page=1&pageSize=20"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  queryParams:
    - key: transactionId
      value: txn_1234567890abcdef
      disabled: false
      description: Filter refunds by transaction ID
    - key: status
      value: pending
      disabled: false
      description: Filter refunds by status
    - key: startDate
      value: 2024-01-01T00:00:00Z
      disabled: false
      description: Filter refunds created on or after this date
    - key: endDate
      value: 2024-01-31T23:59:59Z
      disabled: false
      description: Filter refunds created on or before this date
    - key: page
      value: "1"
      disabled: false
      description: Page number for pagination (1-based)
    - key: pageSize
      value: "20"
      disabled: false
      description: Number of items per page
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "UNAUTHORIZED",
        "message": "Authentication token is required",
        "code": "AUTHENTICATION_ERROR",
        "timestamp": "2024-01-15T10:30:00Z"
      }
order: 3000
