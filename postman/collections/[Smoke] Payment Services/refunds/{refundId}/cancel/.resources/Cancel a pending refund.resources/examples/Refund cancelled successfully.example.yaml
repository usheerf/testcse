$kind: http-example
request:
  url: "{{baseUrl}}/refunds/:refundId/cancel"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    - key: refundId
      value: rfnd_abc123def456
      disabled: false
      description: Unique identifier for the refund
  body:
    type: json
    content: |-
      {
        "reason": "Customer changed mind and wants to keep the item"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "refundId": "rfnd_xyz789ghi012",
        "transactionId": "txn_0987654321fedcba",
        "status": "cancelled",
        "amount": 5000,
        "currency": "USD",
        "refundAmount": 2500,
        "refundCurrency": "USD",
        "reason": "Partial refund for damaged item",
        "createdAt": "2024-01-15T11:00:00Z",
        "updatedAt": "2024-01-15T11:30:00Z",
        "cancelledAt": "2024-01-15T11:30:00Z",
        "cancellationReason": "Customer changed mind and wants to keep the item",
        "links": {
          "self": "/refunds/rfnd_xyz789ghi012"
        }
      }
order: 1000
