$kind: http-example
request:
  url: "{{baseUrl}}/refunds/:refundId/status"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    - key: refundId
      value: rfnd_abc123def456
      disabled: false
      description: Unique identifier for the refund
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "refundId": "rfnd_xyz789ghi012",
        "status": "pending",
        "updatedAt": "2024-01-15T11:00:00Z",
        "estimatedCompletionTime": "2024-01-15T15:00:00Z"
      }
order: 1000
