$kind: http-example
request:
  url: "{{baseUrl}}/refunds/:refundId/status"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  pathVariables:
    - key: refundId
      value: rfnd_abc123def456
      disabled: false
      description: Unique identifier for the refund
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "UNAUTHORIZED",
        "message": "Authentication token is required",
        "code": "AUTHENTICATION_ERROR",
        "timestamp": "2024-01-15T10:30:00Z"
      }
order: 2000
